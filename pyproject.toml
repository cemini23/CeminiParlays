[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceminiparlays"
version = "0.5.0"
description = "Local NFL sportsbook parlay research CLI — fair value, slip EV, no book-site scrapers; Odds API ingest is optional"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cemini" }]
keywords = ["sportsbook", "parlay", "nfl", "hardrock", "fanduel", "draftkings", "pickem", "prizepicks", "underdog", "expected-value"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4,<0.16"]

[project.scripts]
ceminiparlays = "ceminiparlays.cli:main"
prop-fair = "ceminiparlays.cli:main_fair"
prop-rank = "ceminiparlays.cli:main_rank"
prop-grade = "ceminiparlays.cli:main_grade"

[project.urls]
Homepage = "https://github.com/cemini23/CeminiParlays"
Source = "https://github.com/cemini23/CeminiParlays"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceminiparlays = ["py.typed", "data/*.json", "data/payout_profiles/*.json", "data/rosters/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
