[package]
name = "copula_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Rust numeric tail for ceminiparlays simulate_slip (copula Monte Carlo)"
license = "MIT"
publish = false

[lib]
name = "copula_engine"
# cdylib is the Python extension; rlib lets `cargo test` build a harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
# pyo3 is the only dependency. `extension-module` is what makes the cdylib
# importable from Python; it is gated behind the default `python` feature so
# `cargo test --no-default-features` can run the in-crate numeric unit tests
# without linking libpython.
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }

[features]
default = ["python"]
python = ["dep:pyo3"]
